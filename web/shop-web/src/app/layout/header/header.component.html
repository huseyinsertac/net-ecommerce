<mat-toolbar class="header">
  <button mat-icon-button class="menu-button" aria-label="Open menu" [matMenuTriggerFor]="menu">
    <mat-icon fontSet="material-symbols-outlined">menu</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <a mat-menu-item routerLink="/">Shop</a>
  </mat-menu>

  <a class="wordmark" routerLink="/">
    <mat-icon fontSet="material-symbols-outlined" class="bolt">bolt</mat-icon>{{ brand.name }}
  </a>

  <form
    class="search-form"
    [class.open]="searchOpen()"
    role="search"
    (submit)="search($event, q.value)"
  >
    <mat-form-field class="search" appearance="outline" subscriptSizing="dynamic">
      <mat-icon matPrefix fontSet="material-symbols-outlined">search</mat-icon>
      <input
        #q
        matInput
        type="search"
        placeholder="Search products"
        aria-label="Search"
        [value]="currentQuery()"
      />
    </mat-form-field>
    <button mat-icon-button type="submit" aria-label="Submit search">
      <mat-icon fontSet="material-symbols-outlined">arrow_forward</mat-icon>
    </button>
  </form>

  <span class="spacer"></span>

  <button
    mat-icon-button
    type="button"
    class="search-toggle"
    [attr.aria-label]="searchOpen() ? 'Close search' : 'Open search'"
    [attr.aria-expanded]="searchOpen()"
    (click)="toggleSearch()"
  >
    <mat-icon fontSet="material-symbols-outlined">{{ searchOpen() ? 'close' : 'search' }}</mat-icon>
  </button>

  <a mat-button class="nav-link" routerLink="/">Shop</a>

  @if (auth.user(); as user) {
    <button
      mat-icon-button
      type="button"
      class="account-button"
      [attr.aria-label]="'Account menu for ' + user.displayName"
      [matMenuTriggerFor]="accountMenu"
    >
      <span class="avatar" aria-hidden="true">{{ user.displayName.charAt(0).toUpperCase() }}</span>
    </button>
    <mat-menu #accountMenu="matMenu" xPosition="before">
      <div class="account-info">
        <span class="account-name">{{ user.displayName }}</span>
        <span class="account-email">{{ user.email }}</span>
        @if (user.isDemo || auth.isAdmin()) {
          <span class="chips">
            @if (user.isDemo) {
              <span class="chip">Demo account</span>
            }
            @if (auth.isAdmin()) {
              <span class="chip chip-admin">Admin</span>
            }
          </span>
        }
      </div>
      <button mat-menu-item type="button" (click)="signOut()">
        <mat-icon fontSet="material-symbols-outlined">logout</mat-icon>
        Sign out
      </button>
    </mat-menu>
  } @else {
    <a mat-button class="sign-in" routerLink="/login">Sign in</a>
  }

  <a
    mat-icon-button
    class="cart-link"
    routerLink="/cart"
    [attr.aria-label]="cartLabel()"
  >
    <mat-icon
      fontSet="material-symbols-outlined"
      [matBadge]="cart.count()"
      matBadgeSize="small"
      [matBadgeHidden]="cart.count() === 0"
      aria-hidden="false"
      >shopping_cart</mat-icon
    >
  </a>
</mat-toolbar>
