<mat-card class="panel" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Try it out — no sign-up needed</mat-card-title>
    <mat-card-subtitle>
      Customer accounts are private and temporary. Shared admin account — manage products and ship
      orders. Resets nightly.
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <div class="actions">
      <button
        mat-flat-button
        type="button"
        [disabled]="pending() !== null"
        (click)="start('customer')"
      >
        @if (pending() === 'customer') {
          <mat-spinner class="spinner" diameter="18" aria-hidden="true" />
        } @else {
          <mat-icon fontSet="material-symbols-outlined">shopping_bag</mat-icon>
        }
        Try as customer
      </button>
      <button
        mat-stroked-button
        type="button"
        [disabled]="pending() !== null"
        (click)="start('admin')"
      >
        @if (pending() === 'admin') {
          <mat-spinner class="spinner" diameter="18" aria-hidden="true" />
        } @else {
          <mat-icon fontSet="material-symbols-outlined">admin_panel_settings</mat-icon>
        }
        Try as admin
      </button>
    </div>
    <p class="hint">Pay with Stripe's test card 4242 4242 4242 4242, any future date, any CVC.</p>
    <p class="error" role="alert" aria-live="assertive">{{ error() }}</p>
  </mat-card-content>
</mat-card>
