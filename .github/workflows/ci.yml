name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore VoltLane.slnx
      - run: dotnet build VoltLane.slnx --no-restore -c Release
      # Integration tests use Testcontainers (Docker is available on the hosted runner).
      - run: dotnet test --solution VoltLane.slnx -c Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/shop-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/shop-web/package-lock.json
      - run: npm ci
      - run: npx ng lint
      - run: npx ng test --no-watch
        env:
          CI: "true"
      - run: npx ng build

  docker-images:
    # Build (without pushing) so a broken Dockerfile fails before merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Bootstrapper/Shop.Api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web/shop-web
          file: web/shop-web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
